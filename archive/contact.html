<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contact Jimmy Nguyen about software engineering opportunities and projects.">
  <title>Contact | Jimmy's Gallery</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="site-header">
    <div class="brand-row">
      <a class="brand" href="welcome.html" aria-label="Jimmy's Gallery home">
        <img src="images/logo.svg" alt="Jimmy's Gallery">
      </a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation">
        <span class="sr-only">Open navigation menu</span>
        <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
      </button>
    </div>
    <nav id="primary-navigation" class="primary-nav" aria-label="Primary navigation">
      <a href="welcome.html">Welcome</a>
      <a href="about.html">About Me</a>
      <a href="projects.html">Projects</a>
      <a href="resume.html">Resume</a>
      <a class="is-active" href="contact.html" aria-current="page">Contact</a>
    </nav>
  </header>

  <main id="main-content" class="page-shell">
    <section class="content-panel contact-panel" aria-labelledby="contact-title">
      <h1 id="contact-title">Contact</h1>
      <p>Feel free to contact and reach out to me by email or through LinkedIn.</p>

      <div class="contact-links" aria-label="Direct contact links">
        <a class="button" href="mailto:jtnguyen09@outlook.com">Email: jtnguyen09@outlook.com</a>
        <a class="button" href="https://www.linkedin.com/in/jimmy-nguyen-45633b339/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <a class="button" href="https://github.com/TheBrokenCode24" target="_blank" rel="noopener noreferrer">GitHub</a>
      </div>

      <form class="contact-form" data-contact-form novalidate>
        <div class="form-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
          <p class="field-error" id="email-error" aria-live="polite"></p>
        </div>

        <div class="form-field">
          <label for="subject">Subject</label>
          <input id="subject" name="subject" type="text" placeholder="Project inquiry" minlength="3" required>
          <p class="field-error" id="subject-error" aria-live="polite"></p>
        </div>

        <div class="form-field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="7" placeholder="Write your message here" minlength="10" required></textarea>
          <p class="field-error" id="message-error" aria-live="polite"></p>
        </div>

        <button class="button form-submit" type="submit">Send message</button>
        <p class="form-status" data-form-status role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span data-current-year></span> Jimmy Nguyen.</p>
  </footer>
</body>
</html>
